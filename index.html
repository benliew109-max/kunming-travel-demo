ntent:space-between}.itinerary{padding:0 20px}.stop{display:grid;grid-template-columns:26px 1fr;gap:9px;padding:14px 0 12px;border-bottom:1px solid #edf0e9;position:relative}.num{width:23px;height:23px;border:1px solid #93ac99;background:#eff5ed;border-radius:50%;font-size:11px;display:grid;place-items:center;margin-top:2px}.stop.locked .num{background:var(--teal);color:white;border-color:var(--teal)}.stop-title{display:flex;justify-content:space-between;gap:6px}.time{font-size:11px;color:var(--teal);margin-bottom:2px}.stop .desc{font-size:11px;color:var(--muted);margin:5px 0}.stop-actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}.stop-actions button{font-size:10px;padding:3px 7px;border-radius:6px}.transfer{font-size:10px;margin-top:7px;color:#7f8e86}.dayfoot{padding:14px 20px;background:#f8f9f5;display:flex;gap:8px;justify-content:space-between;align-items:center}.map{height:405px;position:relative;background:#edf5f6;overflow:hidden}.map svg{width:100%;height:100%}.maplabel{position:absolute;left:14px;top:14px;background:#fffE;box-shadow:var(--shadow);padding:8px 12px;border-radius:8px;font-size:11px}.maplegend{position:absolute;bottom:12px;right:12px;background:#fffE;padding:5px 10px;border-radius:7px;font-size:10px;color:var(--muted)}.mapmarker{cursor:pointer}.mapmarker:hover circle{fill:#c96b43}.map-bottom{padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}.assistant{margin-top:16px;padding:18px 20px;border:1px solid #cddfcf;border-radius:14px;background:linear-gradient(115deg,#edf5e9,#ffffff)}.assistant .title{display:flex;align-items:center;gap:8px;margin-bottom:7px}.spark{color:var(--teal);font-size:23px}.assistant p{font-size:12px;line-height:1.8;color:#526a5d}.suggestions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.suggestions button{font-size:11px;background:#fffA;padding:6px 11px}.composer{display:flex;gap:7px;margin-top:12px}.composer input{flex:1;min-width:0;border:1px solid #d9e2d4;border-radius:9px;padding:9px;background:#fffC}.composer button{padding:7px 13px}.notice{margin-top:16px;font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}.full{padding:24px;min-height:550px}.placegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:22px}.placecard{padding:20px;background:#fff;border:1px solid var(--line);border-radius:12px}.placeart{height:95px;background:#e8eee1;border-radius:7px;margin-bottom:12px;display:grid;place-items:center;font-size:36px}.placecard button{margin-top:10px;font-size:11px}.modalwrap{position:fixed;inset:0;background:#183d3655;backdrop-filter:blur(4px);z-index:30;display:grid;place-items:center;padding:20px}.modal{background:#fffdf8;border-radius:18px;width:min(670px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 90px #12382f44;padding:27px}.modalhead{display:flex;justify-content:space-between;align-items:start;margin-bottom:17px}.modalhead .quiet{font-size:23px;padding:0 7px}.modal p{font-size:12px;color:var(--muted);margin:9px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}label{display:block;font-size:12px;color:#536b61}input,select,textarea{width:100%;padding:10px 12px;background:white;border:1px solid var(--line);border-radius:8px;color:var(--ink);margin-top:5px}input[type=checkbox]{width:auto;accent-color:var(--teal);margin-right:8px}textarea{height:125px;resize:vertical}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:23px}.checkrow{padding:11px 0;display:flex;align-items:center;border-bottom:1px solid var(--line)}.checkrow label{flex:1}.source{padding:12px 0;border-bottom:1px solid var(--line)}.source a{font-size:12px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:18px 0}.compare>div{padding:17px;border:1px solid var(--line);border-radius:10px}.compare .new{background:#edf5e9;border-color:#b5d0b4}.diff{font-size:12px;margin-top:10px;line-height:1.9}.error{color:#a0492b;font-size:12px}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#153e35;color:white;padding:11px 22px;border-radius:10px;z-index:60;box-shadow:var(--shadow);font-size:12px;max-width:90vw}.progress{height:6px;background:#e3ebdd;margin:20px 0;border-radius:9px;overflow:hidden}.progress span{display:block;background:var(--teal);height:100%;width:0;animation:load 1.2s forwards}@keyframes load{to{width:100%}}.hidden{display:none!important}.mobile-nav{display:none}.widecopy{max-width:760px}.widecopy p{margin:14px 0;color:#536b61}.walkthrough{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:25px}.walkthrough>div{padding:20px;border:1px solid var(--line);border-radius:12px;background:white}.walkthrough b{display:block;margin-bottom:10px}@media(min-width:1450px){.map{height:450px}.main{padding:0 42px 25px}}@media(max-width:1120px){.sidebar{width:170px;padding:25px 15px}.app{grid-template-columns:170px 1fr}.main{padding:0 20px 25px}.workspace{grid-template-columns:1fr}.rightcol{grid-row:1}.map{height:280px}.metrics{gap:8px}.metric{padding:12px}.hero h1{font-size:26px}.people{display:none}}@media(max-width:650px){.app{display:block}.sidebar{display:none}.main{padding:0 14px 80px}.topbar{height:60px}.breadcrumb{font-weight:700;font-size:14px;color:var(--teal)}.topbar button{padding:6px 10px;font-size:11px}.topbar .avatar{display:none}.hero{padding:20px 0 15px}.hero h1{font-size:25px}.hero p{font-size:11px}.metrics{grid-template-columns:repeat(2,1fr);margin-bottom:14px}.metric strong{font-size:20px}.workspace{gap:13px}.map{height:250px}.map-bottom{padding:12px}.assistant{padding:15px}.panel-head{padding:14px 16px}.rightcol{grid-row:auto}.placegrid{grid-template-columns:1fr}.walkthrough{grid-template-columns:1fr}.full{padding:15px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fffF;border-top:1px solid var(--line);z-index:20;justify-content:space-around;padding:7px}.mobile-nav button{border:0;font-size:11px;padding:8px}.mobile-nav button.active{background:var(--pale)}.modal{padding:20px}.formgrid{gap:10px}.notice{display:block}.compare{gap:8px}.compare>div{padding:12px}}

<script>
const $=s=>document.querySelector(s),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed={day:0,title:'昆明三日慢游',city:'昆明',days:3,budget:5000,walk:6000,party:'2 位成人 · 1 位老人 · 1 位儿童',start:'2026-11-06',rain:false,version:1,places:[],trip:[[{id:'greenlake',name:'翠湖公园',time:'09:30',duration:80,walk:1400,cost:0,kind:'城市地标',desc:'先感受翠湖片区，再沿街慢慢走。',x:260,y:190},{id:'food',name:'文林街午餐',time:'11:30',duration:70,walk:1000,cost:240,kind:'当地美食',desc:'预留午餐与休息时间，按同行人口味选择。',x:190,y:130},{id:'academy',name:'云南陆军讲武堂',time:'15:00',duration:90,walk:1400,cost:0,kind:'历史文化',desc:'以展馆参观为主，开放区域与入馆要求待核验。',x:270,y:320}],[{id:'museum',name:'云南省博物馆',time:'10:00',duration:150,walk:2300,cost:0,kind:'需预约',locked:true,desc:'示例中已预约，排程时保留入馆时段。',x:340,y:230},{id:'lunch',name:'官渡午餐与休息',time:'13:00',duration:90,walk:500,cost:240,kind:'休息',desc:'午后留出休息，不连续安排高强度游览。',x:250,y:170},{id:'guandu',name:'官渡古镇',time:'16:00',duration:80,walk:1600,cost:0,kind:'城市地标',desc:'安排室外短距离散步。',x:430,y:310}],[{id:'village',name:'云南民族村',time:'09:30',duration:120,walk:2800,cost:360,kind:'民族文化',desc:'园区较大，仅安排短线体验；实际开放、门票与交通待核验。',x:250,y:100},{id:'meal',name:'滇池片区午餐',time:'12:30',duration:80,walk:600,cost:240,kind:'当地美食',desc:'下午保留返程前的机动时间。',x:210,y:230},{id:'haigeng',name:'海埂公园',time:'15:00',duration:70,walk:1500,cost:0,kind:'湖滨漫步',desc:'沿滇池岸边短距离散步，按体力与天气选择停留时长。',x:300,y:330}]]};
let s;try{s=JSON.parse(localStorage.getItem('xyx-kunming-v1'))||structuredClone(seed)}catch{s=structuredClone(seed)}let history=[],currentView='plan',importItems=[],pending=null,toastTimer;
function save(){try{localStorage.setItem('xyx-kunming-v1',JSON.stringify(s))}catch{toast('浏览器不允许本地保存，本次修改仍可继续使用')}}
function remember(){history.push(structuredClone(s));if(history.length>15)history.shift()}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3800)}
function totals(day=s.day){let a=s.trip[day];return {walk:a.reduce((n,p)=>n+p.walk,0),cost:a.reduce((n,p)=>n+p.cost,0),minutes:a.reduce((n,p)=>n+p.duration,0)}}
function totalCost(){return s.trip.flat().reduce((n,p)=>n+p.cost,0)+1800+720}
function view(v){currentView=v;document.body.classList.toggle('agent-mode',v==='agent');document.querySelectorAll('[data-view]').forEach(e=>e.classList.toggle('active',e.dataset.view===v));$('#crumb').textContent=v==='plan'?s.title:v==='places'?'灵感收藏':v==='agent'?'AI 智能体':'原型说明';if(v==='plan')renderPlan();if(v==='places')renderPlaces();if(v==='guide')renderGuide();if(v==='agent')renderAgent()}
function renderPlan(){let t=totals(),cost=totalCost();$('#content').innerHTML=`<section class="hero"><div><div class="eyebrow">昆明 · 城市慢游</div><h1>${esc(s.title)} <span style="font-size:22px;color:#ff861a">✺</span></h1><p>${esc(s.start)} 起 · ${esc(s.party)} · 住翠湖附近 <button class="quiet small" onclick="openSettings()">编辑偏好 ↗</button></p></div><div class="people"><div><span class="avatar">林</span><span class="avatar" style="background:#d4dfc6">周</span></div><span class="small">一起商量，轻松出发<br>本地协作流程演示</span></div></section><section class="metrics"><div class="metric"><span class="small">行程安排</span><strong>3</strong>天 <span class="small" style="display:inline">· ${s.trip.flat().length} 个地点</span></div><div class="metric"><span class="small">全程估算 · 4 人合计</span><strong>¥${cost.toLocaleString()}</strong><span class="small">${cost>s.budget?'超过预算 ¥'+(cost-s.budget):'预算剩余 ¥'+(s.budget-cost)} · 未含往返昆明交通</span></div><div class="metric"><span class="small">今天的步行量 · 每人</span><strong>${t.walk.toLocaleString()}</strong>步<span class="small">${t.walk>s.walk?'超出步数偏好，建议删减地点':'低于 '+s.walk.toLocaleString()+' 步的偏好'}</span></div><div class="metric"><span class="small">固定安排</span><strong>${s.trip.flat().filter(p=>p.locked).length}</strong>项<span class="small">重排时保留 · 其他地点可调整</span></div></section><div class="workspace"><section class="panel"><div class="panel-head"><h3>每天都有自己的节奏</h3><button class="quiet small" onclick="openImport()">＋ 添加地点</button></div><div class="tabs">${['翠湖慢游','滇韵与古镇','滇池与民族风情'].map((x,i)=>`<button class="${s.day===i?'on':''}" onclick="switchDay(${i})">DAY ${i+1}<br>${x}</button>`).join('')}</div><div class="dayinfo"><div><b>第 ${s.day+1} 天 · ${s.rain&&s.day===2?'雨天也从容':'慢慢走，不赶路'}</b><div class="small">09:30 出发 · 含午休与交通缓冲</div></div><span class="tag">${s.rain&&s.day===2?'室内优先':'轻松安排'}</span></div><div class="itinerary">${s.trip[s.day].length?s.trip[s.day].map((p,i)=>`<article class="stop ${p.locked?'locked':''}" id="stop-${p.id}"><div class="num">${i+1}</div><div><div class="time">${p.time} · 建议停留 ${p.duration} 分钟</div><div class="stop-title"><h3>${esc(p.name)}</h3><span class="tag ${p.locked?'orange':''}">${p.locked?'已锁定':esc(p.kind)}</span></div><div class="desc">${esc(p.desc)}</div><span class="small">约 ${p.walk} 步 · ¥${p.cost} / 4 人</span><div class="stop-actions"><button onclick="toggleLock('${p.id}')">${p.locked?'解锁':'锁定时间'}</button><button onclick="move('${p.id}',-1)" ${i===0||p.locked?'disabled':''}>↑ 提前</button><button onclick="move('${p.id}',1)" ${i===s.trip[s.day].length-1||p.locked?'disabled':''}>↓ 延后</button><button onclick="removeStop('${p.id}')" ${p.locked?'disabled':''}>移除</button><button onclick="openSources('${p.id}')">查看依据</button></div>${i<s.trip[s.day].length-1?'<div class="transfer">↓　交通示例 20–40 分钟 · 含等候缓冲</div>':''}</div></article>`).join(''):'<p style="padding:30px 0">今天还没有地点，导入攻略后再安排。</p>'}</div><div class="dayfoot"><span class="small">修改自动保存 · 版本 ${s.version}</span><button onclick="exportTrip()">导出行程</button></div></section><div class="rightcol"><section class="panel"><div class="panel-head"><h3>在地图上，看见这一天</h3><span class="tag">路线示意</span></div><div class="map">${mapSVG()}<div class="maplabel">昆明 · DAY ${s.day+1}<br><b>${s.trip[s.day].length} 个停靠点</b>　<span style="color:#8c9b8e">◈</span></div><div class="maplegend">示意布局 · 非真实比例与路网</div></div><div class="map-bottom"><div><b>把时间留给喜欢的地方</b><div class="small">地点顺序与左侧行程同步更新</div></div><button onclick="toast('原型仅展示导航交接；正式版将唤起地图 App')">出发导航 ↗</button></div></section><section class="assistant"><div class="title"><span class="spark">✧</span><h3>你的行程，可以随时商量</h3></div><p>${s.rain?'第 3 天已切换为室内优先备选，原有预约和其他日期保持不变。':'已为家庭出行留出休息时间。第二天的博物馆预约已锁定；调整其他安排时会保留它。'}</p><div class="suggestions"><button onclick="openReplan('rain')">☂ 第三天下雨了</button><button onclick="openReplan('tired')">今天少走一点</button><button onclick="openSettings()">调整预算与偏好</button></div><form class="composer" onsubmit="sendPrompt(event)"><input id="prompt" aria-label="行程调整需求" placeholder="试试：第三天下雨，帮我调整一下"><button class="primary" aria-label="发送调整需求">↑</button></form><div class="small" style="margin-top:8px;font-size:10px">支持演示指令：下雨、少走路；其他需求将提示演示范围。</div></section></div></div>`}
function mapSVG(){let a=s.trip[s.day];return `<svg viewBox="0 0 620 410" aria-label="当日地点顺序示意地图" role="img"><defs><pattern id="blocks" width="90" height="74" patternUnits="userSpaceOnUse"><rect x="8" y="8" width="70" height="54" rx="7" fill="#e4ecef"/><path d="M0 70H90M85 0V74" stroke="#ffffff" stroke-width="9"/></pattern></defs><rect width="620" height="410" fill="url(#blocks)"/><path d="M515 -20Q400 115 520 240T470 440" stroke="#c9eeee" stroke-width="35" fill="none"/><rect x="55" y="215" width="100" height="100" rx="35" fill="#d4e9df"/><rect x="353" y="50" width="86" height="80" rx="20" fill="#d4e9df"/><path d="M0 190H620M270 0V410" stroke="#ffffff" stroke-width="18"/><text x="75" y="270" fill="#879d79" font-size="11">城市绿地</text><text x="520" y="160" fill="#739b91" font-size="12" transform="rotate(55 520 160)">城市水系</text><polyline points="${a.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round"/><polyline points="${a.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#00baba" stroke-width="5" stroke-dasharray="7 5" stroke-linejoin="round"/>${a.map((p,i)=>`<g class="mapmarker" onclick="focusStop('${p.id}')"><circle cx="${p.x}" cy="${p.y}" r="16" fill="${p.locked?'#ff861a':'#00c2c2'}" stroke="white" stroke-width="4"/><text x="${p.x}" y="${p.y+4}" font-size="12" fill="white" text-anchor="middle">${i+1}</text><rect x="${p.x+20}" y="${p.y-13}" width="${Math.min(170,p.name.length*12+14)}" height="27" rx="7" fill="#ffffff"/><text x="${p.x+27}" y="${p.y+5}" font-size="11" fill="#4f5259">${esc(p.name)}</text></g>`).join('')}</svg>`}
function focusStop(id){let e=$('#stop-'+id);e.scrollIntoView({behavior:'smooth',block:'center'});e.style.background='#e8fafa';setTimeout(()=>e.style.background='',1500)}
function switchDay(i){s.day=i;save();renderPlan()}
function change(){s.version++;save();view(currentView)}
function toggleLock(id){remember();let p=s.trip[s.day].find(p=>p.id===id);p.locked=!p.locked;change();toast(p.locked?'已锁定时间，后续调整将保留此安排':'已解锁，可参与调整')}
function move(id,dir){let a=s.trip[s.day],i=a.findIndex(p=>p.id===id),j=i+dir;if(j<0||j>=a.length)return;if(a[i].locked||a[j].locked)return toast('固定安排已锁定，先解锁再调整顺序');remember();[a[i],a[j]]=[a[j],a[i]];let times=['09:30','12:30','15:00','17:00'];a.forEach((p,k)=>{if(!p.locked)p.time=times[k]||'18:00'});change();toast('已调整顺序；示例时间已重新分配')}
function removeStop(id){let p=s.trip[s.day].find(p=>p.id===id);if(p.locked)return;remember();s.trip[s.day]=s.trip[s.day].filter(p=>p.id!==id);change();toast('已移除地点，可点击撤销恢复')}
function undo(){if(!history.length)return toast('没有可撤销的修改');s=history.pop();save();view(currentView);toast('已恢复上一个行程版本')}
function modal(title,sub,body,foot=''){ $('#overlay').innerHTML=`<div class="modalwrap" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><div><div class="eyebrow">行有序 / TRAVEL PLANNER</div><h2>${title}</h2><p>${sub}</p></div><button class="quiet" onclick="closeModal()" aria-label="关闭">×</button></div>${body}${foot?`<div class="modalfoot">${foot}</div>`:''}</section></div>`;setTimeout(()=>$('#overlay input, #overlay textarea, #overlay button')?.focus(),0)}
function closeModal(){$('#overlay').innerHTML=''}
function openSettings(){modal('先说说，你想怎样旅行','当前原型支持昆明 3 日示例，偏好修改会更新预算与步数提醒。',`<div class="formgrid"><label>目的地<input id="city" value="昆明" readonly></label><label>旅行天数<select id="days"><option>3 天</option></select></label><label>出发日期<input id="date" type="date" value="${s.start}"></label><label>总预算 · 元<input id="budget" type="number" min="100" value="${s.budget}"></label><label>每日步数上限<input id="walk" type="number" min="500" value="${s.walk}"></label><label>同行人<select id="party"><option>2 位成人 · 1 位老人 · 1 位儿童</option></select></label></div><p>费用口径：4 人合计，包含示例住宿、餐饮、门票与市内交通，不含往返昆明交通。步数为每人估算。</p><div id="formerror" class="error"></div>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="applySettings()">保存偏好并检查</button>`)}
function applySettings(){let budget=Number($('#budget').value),walk=Number($('#walk').value),date=$('#date').value;if(!date||budget<100||walk<500){$('#formerror').textContent='请填写日期、至少 100 元预算和至少 500 步上限。';return}remember();s.budget=budget;s.walk=walk;s.start=date;change();closeModal();toast('已保存偏好；超出预算或步数时会显示提醒')}
function openImport(){modal('把收藏，变成下一站','粘贴攻略文字；原型在本地识别示例地点。链接解析与图片 OCR 待接入。',`<textarea id="importText" placeholder="粘贴攻略文字，例如：翠湖、文林街、云南省博物馆、官渡古镇……"></textarea><div style="margin-top:8px"><button class="quiet small" onclick="$('#importText').value='昆明三日慢游：翠湖、文林街、云南省博物馆、官渡古镇，还有海埂公园。'">填入示例攻略 ↗</button></div><div id="importResult"></div>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="parseImport()">识别攻略地点</button>`)}
function parseImport(){let text=$('#importText').value.trim();if(!text){$('#importResult').innerHTML='<p class="error">请先输入攻略文字。</p>';return}let catalog=seed.trip.flat();importItems=catalog.filter(p=>text.includes(p.name)||text.includes(p.name.split(' ')[0])||(p.id==='greenlake'&&text.includes('翠湖'))||(p.id==='guandu'&&text.includes('官渡古镇'))||(p.id==='food'&&text.includes('文林街')));if(!importItems.length){$('#importResult').innerHTML='<p class="error">未识别到示例地点。可填入示例攻略重试；原文仍保留。</p>';return}$('#importResult').innerHTML=`<h3 style="margin-top:18px">识别到 ${importItems.length} 个地点</h3><p>请确认具体地点，已在当前行程中的地点会跳过。</p>${importItems.map((p,i)=>`<div class="checkrow"><label><input type="checkbox" id="imp${i}" checked>${p.name}</label><span class="tag">${s.trip.flat().some(x=>x.id===p.id)?'已在行程':'可添加'}</span></div>`).join('')}<button class="primary" style="margin-top:15px" onclick="confirmImport()">确认加入当前天</button>`}
function confirmImport(){let chosen=importItems.filter((p,i)=>$('#imp'+i)?.checked);if(!chosen.length)return toast('请至少选择一个地点');let added=chosen.filter(p=>!s.trip.flat().some(x=>x.id===p.id));remember();s.places=[...new Map([...s.places,...chosen].map(x=>[x.id,structuredClone(x)])).values()];added.forEach((p,i)=>s.trip[s.day].push({...structuredClone(p),locked:false,time:'17:00'}));change();closeModal();toast(added.length?`已添加 ${added.length} 个地点，请核对时间与步数`:'地点已在行程，已加入灵感收藏并跳过重复')}
function openReplan(kind){if(kind==='rain'&&s.rain)return toast('第三天已经是雨天方案，可撤销或重置后再次演示');let day=kind==='rain'?2:s.day;let before=s.trip[day],after=structuredClone(before);if(kind==='rain'){after=after.map(p=>p.id==='haigeng'&&!p.locked?{...p,id:'indoorrest',name:'滇池片区室内休息',walk:300,cost:100,kind:'室内备选',desc:'具体休息场所待选择；费用为演示估算。'}:p.id==='village'&&!p.locked?{id:'ethnicmuseum',name:'云南民族博物馆',time:p.time,duration:120,walk:1700,cost:0,kind:'室内优先',desc:'雨天备选示例；开放信息和票额待核验。',x:280,y:140}:p);if(after.every((p,i)=>p.id===before[i].id)){return toast('户外地点被锁定或已移除，无法应用雨天示例')}}else{let candidates=after.filter(p=>!p.locked).sort((a,b)=>b.walk-a.walk);if(!candidates.length)return toast('所有地点都被锁定，请先解锁一个可调整地点');after=after.filter(p=>p.id!==candidates[0].id)}pending={day,after};let old=before.reduce((n,p)=>n+p.walk,0),now=after.reduce((n,p)=>n+p.walk,0),oldCost=before.reduce((n,p)=>n+p.cost,0),newCost=after.reduce((n,p)=>n+p.cost,0);modal('先看看，这样调整可以吗',`仅调整第 ${day+1} 天，已锁定的预约与其他日期保留。`, `<div class="compare"><div><span class="small">当前安排</span><div class="diff">${before.map(p=>esc(p.name)).join('<br>')}</div><p>${old} 步 · ¥${oldCost}</p></div><div class="new"><span class="tag">建议方案</span><div class="diff">${after.map(p=>esc(p.name)).join('<br>')}</div><p>${now} 步 · ¥${newCost}</p></div></div><p>${kind==='rain'?'将未锁定的云南民族村替换为云南民族博物馆，并把未锁定的海埂公园改为室内休息；具体场所与开放信息待核验。':'移除今天步数最多的非锁定地点，保留休息和预约。'}预计少走 ${old-now} 步，费用${newCost>=oldCost?'增加':'减少'} ¥${Math.abs(newCost-oldCost)}。</p><p>以上为固定示例估算，正式版需使用实时地点、开放时间与交通数据重新校验。</p>`,`<button onclick="closeModal()">保留原方案</button><button class="primary" onclick="applyReplan('${kind}')">应用调整</button>`)}
function applyReplan(kind){if(!pending)return;remember();s.trip[pending.day]=pending.after;s.day=pending.day;if(kind==='rain')s.rain=true;pending=null;change();closeModal();toast('新方案已保存，其他日期与固定预约保持不变')}
function sendPrompt(e){e.preventDefault();let v=$('#prompt').value;if(/雨|室内/.test(v))openReplan('rain');else if(/累|少走|步/.test(v))openReplan('tired');else toast('当前演示支持“第三天下雨”和“今天少走一点”，请点击快捷建议体验')}
function openSources(id){let p=s.trip.flat().find(p=>p.id===id);modal('这项安排，依据是什么',p.name,`<div class="source"><b>安排理由</b><p>${p.desc} 时间与步数均为原型演示估算。</p></div><div class="source"><b>信息状态</b><p>地点为真实地名。开放时间、门票库存、天气与交通尚未连接实时服务，不标记为已核验。</p></div><div class="source"><b>固定安排</b><p>${p.locked?'来自本地示例预约，已在当前计划锁定；不代表真实已购票。':'当前未锁定，可参与重排。'}</p></div><div class="source"><b>正式产品的信息依据</b><p>需展示来源链接、核验时间、有效日期与冲突提示，信息失效时重新检查。</p></div>`,`<button class="primary" onclick="closeModal()">知道了</button>`)}
function exportTrip(){let blob=new Blob([JSON.stringify({product:'行有序交互原型',disclaimer:'模拟行程，非真实导航和预订',...s},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='行有序_昆明行程.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前行程 JSON 文件')}
function openShare(){modal('一起看看，这份旅行计划','本地原型提供预览与文件导出；未创建在线分享链接。',`<h3>${esc(s.title)}</h3><p>${esc(s.start)} 起 · 3 天 · ${esc(s.party)}</p>${s.trip.map((d,i)=>`<div class="source"><b>DAY ${i+1}</b><p>${d.map(p=>esc(p.name)+(p.locked?'〔锁定〕':'')).join(' → ')}</p></div>`).join('')}<p>正式版邀请权限：仅查看 / 可编辑；创建者可撤销。当前不支持真实多人同步。</p>`,`<button onclick="closeModal()">关闭</button><button class="primary" onclick="exportTrip()">导出当前行程</button>`)}
function renderPlaces(){let a=s.places.length?s.places:seed.trip.flat().slice(0,6);$('#content').innerHTML=`<section class="hero"><div><div class="eyebrow">SAVE THE PLACES THAT MOVE YOU</div><h1>把喜欢的地方，留给下一程</h1><p>导入的地点会保留在这里，已经在行程中的地点不重复添加。</p></div><button class="primary" onclick="openImport()">＋ 导入攻略</button></section><div class="placegrid">${a.map((p,i)=>`<article class="placecard"><div class="placeart">${['◉','✺','⌂','▥','◈','✧'][i%6]}</div><span class="tag">${esc(p.kind)}</span><h3 style="margin-top:8px">${esc(p.name)}</h3><p class="small">${esc(p.desc)}</p><button onclick="addPlace('${p.id}')">加入第 ${s.day+1} 天</button></article>`).join('')}</div>`}
function addPlace(id){if(s.trip.flat().some(p=>p.id===id))return toast('该地点已在行程中，已跳过重复');let p=[...seed.trip.flat(),...s.places].find(p=>p.id===id);remember();s.trip[s.day].push({...structuredClone(p),locked:false,time:'17:00'});change();toast('已加入当前天，请到行程检查时间与步数')}
function renderGuide(){$('#content').innerHTML=`<section class="hero"><div><div class="eyebrow">PROTOTYPE / V1.2</div><h1>一次可以完整走通的规划体验</h1><p>与配套 PRD 的 F01–F08 对应；适用于桌面与手机浏览器。</p></div></section><section class="widecopy"><p>产品定位：为已有旅行想法、希望保留自主选择的家庭自由行用户，把碎片攻略变成可修改的行程。优先验证约束保留、局部重排与信息可信度。</p><div class="walkthrough"><div><b>01 导入与确认</b><p>导入攻略 → 填入示例 → 识别地点 → 勾选确认；查看重复地点处理。</p><button onclick="openImport()">体验导入</button></div><div><b>02 编辑与保留</b><p>切换日期、锁定安排、调整非锁定地点顺序、移除地点，再撤销。</p><button onclick="view('plan')">查看行程</button></div><div><b>03 行中调整</b><p>点击“第三天下雨了” → 比较新旧方案 → 应用 → 查看地图与统计变化。</p><button onclick="openReplan('rain')">体验重排</button></div></div><p><b>新增 AI 智能体：</b>独立 Tab 提供快捷提问、连续对话展示、旅行偏好记录、攻略文字入口与图片预览；引用当前行程，建议方案通过现有对比弹窗确认后应用。回复为本地规则演示，未接入大模型。</p><button onclick="view('agent')">体验 AI 智能体 →</button><p><b>实现范围：</b>本地地点关键词识别、勾选导入、去重、偏好校验、日期切换、行程增删与排序、预约锁定、两种重排比较、撤销、本地保存与 JSON 导出。</p><p><b>演示边界：</b>不调用大模型，不抓取外部攻略链接，不执行 OCR，不提供真实地图算路、预约或支付，不同步多人数据。地图、费用、步数、天气和时间为演示数据。界面“已锁定”仅指计划中的固定安排。</p><p><b>建议评审顺序：</b>先检查流程可理解性，再测试调整时用户是否能预测哪些内容会变化，最后判断信息状态是否足够清晰。</p></section>`}
function resetDemo(){modal('重置本地示例','将清除当前原型中的修改与收藏，恢复初始昆明行程。','<p>此操作只影响当前浏览器的原型数据。</p>','<button onclick="closeModal()">取消</button><button class="primary" onclick="doReset()">恢复初始示例</button>')}
function doReset(){remember();s=structuredClone(seed);save();closeModal();view('plan');toast('已恢复初始示例，可撤销')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});view('plan');
</script><script src="agent.js"></script></body></html>
